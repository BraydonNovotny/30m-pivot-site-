name: scan
on:
  schedule:
    # every 15 min, 13:25-20:05 UTC (6:25am-1:05pm PT), Mon-Fri — covers the full RTH session
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: run scan
        run: node scripts/scan.js
      - name: publish score.js to docs (keep in sync)
        run: cp scripts/score.js docs/score.js
      - name: commit data
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/data.json docs/score.js docs/history
          git diff --quiet --cached || git commit -m "auto: scan update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
